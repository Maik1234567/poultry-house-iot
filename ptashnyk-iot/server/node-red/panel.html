<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Пташник №1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>body{font-family:sans-serif;margin:0;background:#eef1f5}header{background:#1f3a5f;color:#fff;padding:12px 16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px}
.c{background:#fff;border-radius:8px;padding:10px 12px}.k{font-size:12px;color:#52606d}.v{font-size:24px;font-weight:bold}
#alarm{color:#c53030;padding:0 16px}</style></head><body>
<header><b>Пташник №1</b> · <span id="st">підключення…</span></header>
<div class="g">
<div class="c"><div class="k">Температура, °C</div><div class="v" id="temp">–</div></div>
<div class="c"><div class="k">Уставка, °C</div><div class="v" id="setpoint">–</div></div>
<div class="c"><div class="k">NH₃, ppm</div><div class="v" id="nh3">–</div></div>
<div class="c"><div class="k">CO₂, ppm</div><div class="v" id="co2">–</div></div>
<div class="c"><div class="k">Вентиляція, м³/с</div><div class="v" id="vent_m3s">–</div></div>
<div class="c"><div class="k">Нагрів, Вт</div><div class="v" id="heater_w">–</div></div>
<div class="c"><div class="k">Режим</div><div class="v" id="mode">–</div></div>
<div class="c"><div class="k">Нова уставка</div><input id="sp" type="number" step="0.5" value="23" style="width:70px">
<button onclick="setSp()">Застосувати</button></div></div>
<p id="alarm"></p>
<script>
// Параметри (необов'язкові): ?broker=wss://broker.hivemq.com:8884/mqtt&base=ir45-maik/farm/h1
const q = new URLSearchParams(location.search);
const url = q.get('broker') || ('ws://' + (location.hostname || 'localhost') + ':9001');
const base = q.get('base') || 'farm/h1';
const c = mqtt.connect(url);
c.on('connect', () => { st.textContent = 'MQTT: online'; c.subscribe([base + '/+/telemetry', base + '/alarm', base + '/+/status']); });
c.on('message', (t, m) => {
  const s = m.toString();
  if (t.endsWith('/status')) { st.textContent = 'вузол: ' + s; return; }
  const d = JSON.parse(s);
  if (t === base + '/alarm') { alarm.textContent = 'ТРИВОГА: ' + s; return; }
  for (const k of ['temp','setpoint','nh3','co2','vent_m3s','heater_w','mode']) document.getElementById(k).textContent = d[k];
});
function setSp() { c.publish(base + '/setpoints', JSON.stringify({temp_setpoint: +sp.value}), {qos: 1, retain: true}); }
</script></body></html>
