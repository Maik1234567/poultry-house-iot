# Навчальна конфігурація. Для реального об'єкта: allow_anonymous false,
# password_file і TLS-слухач 8883 (див. розд. 2.3 звіту).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous true

# MQTT через WebSocket для вебпанелі в браузері
listener 9001
protocol websockets
